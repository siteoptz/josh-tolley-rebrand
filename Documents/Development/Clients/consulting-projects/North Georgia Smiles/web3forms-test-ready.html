<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3Forms Test - Ready to Deploy</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f9fafb;
            color: #175e6a;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(23, 94, 106, 0.1), 0 2px 4px -1px rgba(23, 94, 106, 0.06);
        }
        h1 {
            color: #175e6a;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #175e6a;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e4e4e4;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: 'Arial', sans-serif;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ebab65;
            box-shadow: 0 0 0 3px rgba(235, 171, 101, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        button {
            background: #ebab65;
            color: #175e6a;
            padding: 16px 32px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(23, 94, 106, 0.1), 0 2px 4px -1px rgba(23, 94, 106, 0.06);
        }
        button:hover {
            background: #d99548;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(23, 94, 106, 0.15), 0 4px 6px -2px rgba(23, 94, 106, 0.08);
        }
        button:disabled {
            background: #ccc;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .info-box {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #ffeaa7;
        }
        .phone-display {
            font-weight: 600;
            color: #175e6a;
            font-size: 1.1rem;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            body {
                margin: 20px auto;
                padding: 10px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Web3Forms Test - Ready!</h1>
        <p class="subtitle">Testing with your actual access key: 6e875beb-e289-40a2-a64a-fbc754346b52</p>
        
        <div class="info-box">
            <strong>📧 Email will be sent to:</strong> antonio@siteoptz.com<br>
            <strong>🔧 Service:</strong> Web3Forms (much more reliable than FormSubmit)<br>
            <strong>⚡ Status:</strong> Ready to test immediately
        </div>
        
        <div id="status" class="status"></div>
        
        <form id="testForm">
            <!-- Hidden Web3Forms configuration -->
            <input type="hidden" name="access_key" value="6e875beb-e289-40a2-a64a-fbc754346b52">
            <input type="hidden" name="subject" value="🧪 Web3Forms Test - North Georgia Smiles">
            <input type="hidden" name="from_name" value="North Georgia Smiles Website">
            <input type="hidden" name="redirect" value="">
            
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="firstName" value="Test" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="lastName" value="User" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" value="test@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone *</label>
                    <input type="tel" id="phone" name="phone" value="770-123-4567" required>
                </div>
            </div>

            <div class="form-group">
                <label for="service">Service Needed *</label>
                <select id="service" name="service" required>
                    <option value="test">🧪 Test Submission</option>
                    <option value="cleaning">Dental Cleaning & Exam</option>
                    <option value="emergency">Emergency Care</option>
                    <option value="consultation">General Consultation</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4">This is a test submission using Web3Forms to verify email delivery works correctly. Time: ${new Date().toLocaleString()}</textarea>
            </div>

            <button type="submit" id="submitBtn">
                🚀 Send Test Email
            </button>
        </form>
        
        <div style="margin-top: 30px; text-align: center; color: #6b7280;">
            <p>Or call us directly: <span class="phone-display">(770)-884-2868</span></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('testForm');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        
        // Update message with current time
        document.getElementById('message').value = `This is a test submission using Web3Forms to verify email delivery works correctly. Time: ${new Date().toLocaleString()}`;
        
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status show ${type}`;
        }
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Sending...';
            showStatus('Sending email via Web3Forms...', 'info');
            
            try {
                const formData = new FormData(form);
                const object = Object.fromEntries(formData);
                const json = JSON.stringify(object);
                
                console.log('Sending to Web3Forms:', object);
                
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: json
                });
                
                const result = await response.json();
                console.log('Web3Forms response:', result);
                
                if (result.success) {
                    showStatus('✅ SUCCESS! Email sent to antonio@siteoptz.com. Check your inbox!', 'success');
                    form.reset();
                    
                    // Update message for next test
                    setTimeout(() => {
                        document.getElementById('message').value = `This is a test submission using Web3Forms to verify email delivery works correctly. Time: ${new Date().toLocaleString()}`;
                    }, 100);
                } else {
                    throw new Error(result.message || 'Unknown error from Web3Forms');
                }
                
            } catch (error) {
                console.error('Submission error:', error);
                showStatus(`❌ Error: ${error.message}`, 'error');
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Send Test Email';
            }
        });
        
        // Log page info
        console.log('Web3Forms Test Page Loaded');
        console.log('URL:', window.location.href);
        console.log('Access Key:', '6e875beb-e289-40a2-a64a-fbc754346b52');
        console.log('Ready to test!');
    </script>
</body>
</html>
